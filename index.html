document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

;border-radius:100px;cursor:pointer\">Request changes<\u002Fspan>\n    <\u002Fdiv>\n    <sc-if value=\"{{ reqOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:ctSlideUp .28s cubic-bezier(.2,.8,.3,1);margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px\">\n        <div style=\"font-size:12px;font-weight:650;color:var(--sub);letter-spacing:0.5px\">WHAT NEEDS TO CHANGE?<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:10px\">\n          <sc-for list=\"{{ reqChips }}\" as=\"rc\" hint-placeholder-count=\"4\">\n            <span onclick=\"{{ rc.onTap }}\" style=\"flex:none;white-space:nowrap;font-size:12.5px;font-weight:600;background:{{ rc.bg }};color:{{ rc.fg }};padding:7px 13px;border-radius:100px;cursor:pointer;border:1.5px solid {{ rc.ring }}\">{{ rc.label }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:12px;background:var(--chip);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--faint);min-height:52px\">Add a note for Claude Delegate (optional)…<\u002Fdiv>\n        <div onclick=\"{{ sendReq }}\" style=\"margin-top:12px;text-align:center;background:var(--inv);color:var(--invtxt);font-size:14px;font-weight:650;padding:13px;border-radius:100px;cursor:pointer\">Send back to Claude Delegate<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ reqSent }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:ctSlideUp .28s cubic-bezier(.2,.8,.3,1);margin-top:14px;background:{{ tintBlBg }};border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:10px\">\n        <span style=\"font-size:15px;color:{{ tintBlFg }}\">↩<\u002Fspan>\n        <div style=\"min-width:0;flex:1\">\n          <div style=\"font-size:13.5px;font-weight:650;color:{{ tintBlFg }}\">Changes requested — {{ reqReason }}<\u002Fdiv>\n          <div style=\"font-size:12px;color:{{ tintBlFg }};opac  {&quot;width&quot;: 390, &quot;height&quot;: 844}, &quot;darkMode&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Theme&quot;}, &quot;accent&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#FF6B35&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;#FF6B35&quot;, &quot;#B4531F&quot;, &quot;#2A63C9&quot;, &quot;#0E7A61&quot;], &quot;section&quot;: &quot;Theme&quot;}}\">\nclass Component extends DCLogic {\n  state = { screen: 'home', approved: false, dark: null, colIdx: 0, meetSel: { C: true, G: true, Ge: false, CC: false, D: false, PC: false }, reqOpen: false, reqSent: false, reqSel: 0, promptIdx: 0, ran: false, plugIdx: 0, plugConn: { C: true, G: true, Ge: true, CC: true, D: true, PC: false, MCP: false } };\n\n  go(screen) { this.setState({ screen }); }\n\n  isDark() { return this.state.dark ?? this.props.darkMode ?? false; }\n\n  swipeStart(e) {\n    const t = e.touches && e.touches[0];\n    this._sw = t ? { x: t.clientX, y: t.clientY } : null;\n  }\n  swipeEnd(e, target) {\n    const s = this._sw; this._sw = null;\n    const t = e.changedTouches && e.changedTouches[0];\n    if (!s || !t) return;\n    const dx = t.clientX - s.x, dy = Math.abs(t.clientY - s.y);\n    if (s.x < 60 && dx > 70 && dy < 60) this.go(target);\n  }\n\n  syncBody() {\n    document.body.style.background = this.isDark() ? '#131211' : '#F5F4F1';\n  }\n  componentDidMount() {\n    this.syncBody();\n    this._onDown = (e) => {\n      let el = e.target;\n      while (el && el !== document.body && !(el.style && el.style.cursor === 'pointer')) el = el.parentElement;\n      if (!el || el === document.body) return;\n      this._pressed = el;\n      el.style.transition = 'transform .09s ease';\n      el.style.transform = 'scale(0.965)';\n      if (navigator.vibrate) { try { navigator.vibrate(8); } catch (err) {} }\n    };\n    this._onUp = () => {\n      cons       ran: this.state.ran,\n      runPrompt: () => this.setState({ ran: true }),\n      runBg: this.state.ran ? '#0E7A61' : '#FF6B35',\n      runFg: '#fff',\n      runLabel: this.state.ran ? '✓ Queued' : 'Run test',\n    };\n  }\n\n  pluginVals(th, s) {\n    const conn = this.state.plugConn;\n    const on = [th.gn[1], th.gn[0]], off = [th.sub, th.chip];\n    const perm = (label, note, ok) => ({ label, note, mark: ok ? '✓' : '–', bg: ok ? th.gn[0] : th.chip, fg: ok ? th.gn[1] : th.faint });\n    const base = [\n      { key: 'C', initial: 'C', name: 'Claude', provider: 'Anthropic', bg: th.or[0], fg: th.or[1], delegateName: 'Claude Delegate' },\n      { key: 'G', initial: 'G', name: 'ChatGPT', provider: 'OpenAI', bg: th.gn[0], fg: th.gn[1], delegateName: 'ChatGPT Delegate' },\n      { key: 'Ge', initial: 'Ge', name: 'Gemini', provider: 'Google', bg: th.bl[0], fg: th.bl[1], delegateName: 'Gemini Delegate' },\n      { key: 'CC', initial: 'CC', name: 'Claude Code', provider: 'Anthropic · CLI', bg: th.inv, fg: th.invtxt, delegateName: 'Claude Code Delegate' },\n      { key: 'D', initial: 'D', name: 'Dispatch', provider: 'Cooktop Labs', bg: th.pu[0], fg: th.pu[1], delegateName: 'Dispatch Delegate' },\n      { key: 'PC', initial: 'PC', name: 'Local PC Agent', provider: 'This device', bg: th.gray[0], fg: th.gray[1], delegateName: 'Local AI Delegate' },\n      { key: 'MCP', initial: 'M', name: 'MCP Server', provider: 'Custom connector', bg: th.gray[0], fg: th.gray[1], delegateName: 'MCP Delegate' },\n    ];\n    const plugins = base.map((p, i) => {\n      const isOn = !!conn[p.key];\n      return { ...p,\n        status: isOn ? 'Connected' : 'Off',\n        stFg: isOn ? on[0] : off[0], stBg: isOn ? on[1] : off[1],\n        onTap: () => this.setState({ screen: 'plugin', plugIdx: i }),\n        perms: [\n          perm('Join meetings when invited', 'Speaks only as ' + p.delegateName, isOn),\n          perm('Submit deliverables', 'All work needs your approval', isOn),\n screen: 'taskDetail' });\n    const openCol = (i) => () => this.setState({ screen: 'collectable', colIdx: i });\n\n    const collectables = [\n      { icon: 'Aa', typeShort: 'Copy doc', title: 'Pricing page copy — final', from: 'CT-114', initial: 'C', bg: th.or[0], fg: th.or[1],\n        ref: 'CB-21', type: 'COPY DOCUMENT', origin: 'Made from CT-114', by: 'Claude Delegate', meta: 'Atlas Launch · today',\n        heading: '\"Pay for what you run. Nothing else.\"', body: 'Full pricing page copy: headline Option B, trimmed subhead (68 chars), three tier descriptions and FAQ answers. Approved by you.',\n        provenance: 'Drafted in Atlas Launch Review · verified by ChatGPT against competitor scan · length flag by Gemini resolved in v3 · approved by Chairperson.' },\n      { icon: '▦', typeShort: 'Report', title: 'Competitor pricing scan', from: 'CT-109', initial: 'G', bg: th.gn[0], fg: th.gn[1],\n        ref: 'CB-20', type: 'RESEARCH REPORT', origin: 'Made from CT-109', by: 'ChatGPT Delegate', meta: 'Atlas Launch · 1 hr ago',\n        heading: '9 competitors, 4 pricing models compared', body: 'Side-by-side matrix of per-seat vs usage pricing, discount ladders, and two recent \"unlimited\"-claim walk-backs flagged as risks.',\n        provenance: 'Researched across 9 public sources · cited in Mission Room when selecting headline Option B.' },\n      { icon: '✓', typeShort: 'Runbook', title: 'Launch-day runbook', from: 'CT-108', initial: 'C', bg: th.or[0], fg: th.or[1],\n        ref: 'CB-19', type: 'RUNBOOK', origin: 'Made from CT-108', by: 'Claude Delegate', meta: 'Atlas Launch · 2 hr ago',\n        heading: '14-step launch sequence with owners', body: 'Hour-by-hour launch checklist: status page, comms templates, rollback triggers, and delegate assignments for launch morning.',\n        provenance: 'Drafted by Claude · reviewed and approved by Chairperson 2 hours ago.' },\n      { icon: '<\u002F>', typeShort: 'Changelog', title: 'v2.4 changelog summary', from: 'CT-105
